<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | TechBridge</title>
    <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
    <header class="navbar">
        <a href="../index.html" class="brand">
            <span class="brand-icon">◆</span>
            <span>TechBridge</span>
        </a>

        <nav class="nav-links">
            <a href="./marketplace.html">Marketplace</a>
            <a href="./register.html" class="btn btn-primary">Cadastrar empresa</a>
        </nav>
    </header>

    <main class="form-container">
        <section class="card">
            <span class="badge">Acesso empresarial</span>

            <h1 style="margin: 18px 0 10px;">Entrar na plataforma</h1>

            <p style="color: var(--muted); margin-bottom: 24px;">
                Acesse sua conta para cadastrar resíduos, acompanhar interesses e visualizar seu dashboard.
            </p>

            <form id="loginForm" class="form">
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input 
                        type="email" 
                        id="email" 
                        placeholder="empresa@email.com"
                        required
                    />
                </div>

                <div class="form-group">
                    <label for="password">Senha</label>
                    <input 
                        type="password" 
                        id="password" 
                        placeholder="Digite sua senha"
                        required
                    />
                </div>

                <button type="submit" class="btn btn-primary">
                    Entrar
                </button>

                <p id="loginMessage" class="message"></p>
            </form>

            <p style="color: var(--muted); margin-top: 22px;">
                Ainda não tem conta?
                <a href="./register.html" style="color: var(--primary); font-weight: 700;">
                    Cadastre sua empresa
                </a>
            </p>
        </section>
    </main>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
