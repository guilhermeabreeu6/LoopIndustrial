<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro | TechBridge</title>
    <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
    <header class="navbar">
        <a href="../index.html" class="brand">
            <span class="brand-icon">◆</span>
            <span>TechBridge</span>
        </a>

        <nav class="nav-links">
            <a href="./marketplace.html">Marketplace</a>
            <a href="./login.html" class="btn btn-secondary">Login</a>
        </nav>
    </header>

    <main class="form-container">
        <section class="card">
            <span class="badge">Cadastro B2B</span>

            <h1 style="margin: 18px 0 10px;">Cadastrar empresa</h1>

            <p style="color: var(--muted); margin-bottom: 24px;">
                Crie sua conta para publicar resíduos, encontrar oportunidades e acompanhar impacto ambiental.
            </p>

            <form id="registerForm" class="form">
                <div class="form-group">
                    <label for="companyName">Nome da empresa</label>
                    <input 
                        type="text" 
                        id="companyName" 
                        placeholder="EcoMetal Industries"
                        required
                    />
                </div>

                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input 
                        type="email" 
                        id="email" 
                        placeholder="empresa@email.com"
                        required
                    />
                </div>

                <div class="form-group">
                    <label for="password">Senha</label>
                    <input 
                        type="password" 
                        id="password" 
                        placeholder="Mínimo 6 caracteres"
                        required
                        minlength="6"
                    />
                </div>

                <div class="form-group">
                    <label for="city">Cidade</label>
                    <input 
                        type="text" 
                        id="city" 
                        placeholder="Palmas"
                        required
                    />
                </div>

                <div class="form-group">
                    <label for="state">Estado</label>
                    <input 
                        type="text" 
                        id="state" 
                        placeholder="TO"
                        maxlength="2"
                        required
                    />
                </div>

                <div class="form-group">
                    <label for="industry">Setor industrial</label>
                    <input 
                        type="text" 
                        id="industry" 
                        placeholder="Metallurgy"
                        required
                    />
                </div>

                <button type="submit" class="btn btn-primary">
                    Criar conta
                </button>

                <p id="registerMessage" class="message"></p>
            </form>

            <p style="color: var(--muted); margin-top: 22px;">
                Já tem conta?
                <a href="./login.html" style="color: var(--primary); font-weight: 700;">
                    Entrar
                </a>
            </p>
        </section>
    </main>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
